<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .open { fill: #ffffff; }
    .achieve { fill: url(#grad); }
  </style>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="text">
    <tspan class="open">open</tspan><tspan class="achieve">achieve</tspan>
  </text>
</svg>
